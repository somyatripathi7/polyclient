[package]
name = "polyclient-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "polyclient desktop client (Tauri host)"

[lib]
name = "polyclient_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# HTTP requests for the `curlui` workspace are issued from the frontend via this
# plugin (not the sidecar). `unsafe-headers` lets the client set otherwise
# "forbidden" headers like User-Agent/Cookie, which an HTTP client legitimately
# needs. `tauri-plugin-fs` reads local files for multipart uploads.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-fs = "2"
portable-pty = "0.9"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
anyhow.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sha2 = "0.11"
url = "2"

polyclient-core.workspace = true

# Self-update is desktop-only (no mobile target).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Used to disable macOS system text substitutions (auto-capitalize, smart
# quotes/dashes) that corrupt typed input inside the WebView.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }
