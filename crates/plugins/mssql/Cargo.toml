[package]
name = "polyclient-plugin-mssql"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "polyclient-plugin-mssql"
path = "src/main.rs"

[dependencies]
polyclient-core.workspace = true
polyclient-rdbms-common.workspace = true
polyclient-plugin-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
futures-util = "0.3"
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono", "rust_decimal"] }
tokio-util = { version = "0.7", features = ["compat"] }
bb8 = "0.9"
bb8-tiberius = "0.16"
uuid = { workspace = true }
rust_decimal = "1"
chrono = "0.4"
