[package]
name = "polyclient-plugin-mongodb"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
polyclient-core.workspace = true
polyclient-plugin-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
# `preserve_order` keeps JSON object key order through serde_json::Value so the
# command name stays the first field of a `runCommand` document (the server
# requires it). Scoped to this sidecar binary; doesn't affect other plugins/host.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "bson-3", "compat-3-3-0"] }
futures-util = "0.3"
bson = { version = "3", features = ["serde", "serde_json-1"] }
